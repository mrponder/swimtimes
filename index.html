<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swim Times Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#e8f3f5;--card:#fff;--ink:#0d2b33;--muted:#5a7780;--line:#cfe0e4;--c1:#0e7c86;--c2:#c26a00;--c3:#6b4fd3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1e24;--card:#12303a;--ink:#e6f3f6;--muted:#92b0b8;--line:#245060;--c1:#4fc3cc;--c2:#f0a94a;--c3:#a995ff}}
:root[data-theme="dark"]{--bg:#0b1e24;--card:#12303a;--ink:#e6f3f6;--muted:#92b0b8;--line:#245060;--c1:#4fc3cc;--c2:#f0a94a;--c3:#a995ff}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
.rope{height:14px;background:repeating-linear-gradient(90deg,var(--c1) 0 28px,var(--card) 28px 56px,var(--c2) 56px 84px,var(--card) 84px 112px)}
main{max-width:980px;margin:0 auto;padding:24px 18px 48px}
h1{font:700 clamp(2rem,6vw,3.2rem)/1 "Barlow Condensed",Impact,sans-serif;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 22px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.tabs button{font:600 1rem Barlow,system-ui,sans-serif;padding:10px 20px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ac);border-color:var(--ac);color:#fff}
.tabs button:focus-visible,.more:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sum{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:20px;color:var(--muted)}
.sum b{display:block;font:700 2rem/1 "Barlow Condensed",Impact,sans-serif;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--ac);border-radius:10px;padding:16px 18px}
.card h2{font:700 1.5rem/1.1 "Barlow Condensed",Impact,sans-serif;margin:0}
.meta{color:var(--muted);font-size:.9rem;margin:2px 0 12px}
.row{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.rank{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;border:2px solid var(--line)}
.r1 .rank{background:var(--ac);border-color:var(--ac);color:#fff}
.t{font:700 1.9rem/1 "Barlow Condensed",Impact,sans-serif}
.d{color:var(--muted);font-size:.85rem}
.imp{margin:12px 0 0;font-size:.9rem;color:var(--ac);font-weight:600}
.more{margin-top:20px;font:600 1rem Barlow,system-ui,sans-serif;padding:10px 18px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.logos{display:flex;gap:10px;align-items:center;margin-left:auto}
.logos img{height:64px;width:auto;background:#fff;border-radius:10px;padding:4px;border:1px solid var(--line)}
.head{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px}
.head .sum{margin:0}
.who{display:flex;align-items:center;gap:12px;margin:26px 0 12px;flex-wrap:wrap}
.who h2{font:700 2rem/1 "Barlow Condensed",Impact,sans-serif;margin:0;color:var(--ac)}
.who .logos img{height:44px}
.pb{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pb th{font-weight:600;color:var(--muted);text-align:left;font-size:.85rem;padding:10px 14px;border-bottom:2px solid var(--ac)}
.pb td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}
.pb .t{font-size:1.7rem;color:var(--ac)}
.tw{overflow-x:auto}
.note{margin-top:28px;color:var(--muted);font-size:.85rem}
</style>
</head>

<p class="note">Relays are left out, since relay times belong to the team. Equal times share a rank. Data as of Oct 18, 2026.</p>

const ALT={irish:"Irish Aquatics logo",rhs:"Riley High School RHS logo"};
const LOGOS={H:["rhs","irish"],L:["rhs","irish"],E:["irish"]};
const logos=k=>`<div class="logos">${LOGOS[k].map(x=>`<img src="${IMG[x]}" alt="${ALT[x]}">`).join("")}</div>`;
const KIDS=[{k:"H",n:"Henry",c:"var(--c1)"},{k:"L",n:"Louis",c:"var(--c2)"},{k:"E",n:"Everett",c:"var(--c3)"}];
const STROKE={Free:"Freestyle",Back:"Backstroke",Breast:"Breaststroke",Fly:"Butterfly",IM:"Individual Medley"};
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const secs=t=>t.includes(":")?t.split(":").reduce((a,x)=>a*60+ +x,0):+t;
const fmt=s=>{if(s<60)return s.toFixed(2);const m=Math.floor(s/60),r=s-m*60;return m+":"+(r<10?"0":"")+(Number.isInteger(r)?r:r.toFixed(2))};
const fmtDur=s=>s>=60?Math.floor(s/60)+" min "+Math.round(s%60)+" sec":s.toFixed(2)+" sec";
const pd=d=>{const[m,dd,y]=d.split("/").map(Number);return new Date(y<100?2000+y:y,m-1,dd)};
const fd=d=>MON[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear();
const long=e=>{const[a,...b]=e.split(" ");return a+" "+b.map(w=>STROKE[w]||w).join(" ")};
const swims=RAW.split("\n").map(l=>{const[k,d,e,t,p]=l.split("|");return{k,date:pd(d),e,s:secs(t),p}});
let cur="H",all=false;
const rankEvents=k=>{const by={};swims.filter(x=>x.k===k).forEach(x=>(by[x.e]??=[]).push(x));
  return Object.entries(by).map(([e,a])=>({e,a:a.sort((x,y)=>x.s-y.s||y.date-x.date),last:Math.max(...a.map(x=>x.date))})).sort((x,y)=>y.a.length-x.a.length||y.last-x.last)};
function best(){
  const out=document.getElementById("out");
  out.style.setProperty("--ac","var(--c1)");
  out.innerHTML=KIDS.map(kid=>{
    const evs=rankEvents(kid.k).slice(0,3);
    return `<section style="--ac:${kid.c}"><div class="who"><h2>${kid.n}</h2>${logos(kid.k)}</div><div class="tw"><table class="pb"><thead><tr><th>Event</th><th>Fastest time</th><th>Set on</th><th>Times swum</th></tr></thead><tbody>${evs.map(({e,a})=>`<tr><td>${long(e)}</td><td class="t">${fmt(a[0].s)}</td><td>${fd(a[0].date)}<div class="d">${a[0].p}</div></td><td>${a.length}</td></tr>`).join("")}</tbody></table></div></section>`}).join("");
}
function build(){
  if(cur==="B")return best();
  const kid=KIDS.find(x=>x.k===cur),mine=swims.filter(x=>x.k===cur);
  const evs=rankEvents(cur);
  const shown=all?evs:evs.slice(0,3);
  const out=document.getElementById("out");
  out.style.setProperty("--ac",kid.c);
  out.innerHTML=`<div class="head"><div class="sum"><div><b>${mine.length}</b>individual swims</div><div><b>${evs.length}</b>events swum</div></div>${logos(cur)}</div>
  <div class="grid">${shown.map(({e,a})=>{
    let prev=null,rk=0;
    const rows=a.slice(0,3).map((x,i)=>{if(x.s!==prev)rk=i+1;prev=x.s;
      return `<div class="row r${rk}"><span class="rank">${rk}</span><div><div class="t">${fmt(x.s)}</div><div class="d">${fd(x.date)} · ${x.p}</div></div></div>`}).join("");
    const first=[...a].sort((x,y)=>x.date-y.date)[0],gain=first.s-a[0].s;
    const imp=a.length>1&&gain>0?`<p class="imp">Best is ${fmtDur(gain)} faster than the first swim</p>`:"";
    return `<section class="card"><h2>${long(e)}</h2><p class="meta">Swum ${a.length} time${a.length>1?"s":""}</p>${rows}${imp}</section>`}).join("")}</div>
  ${evs.length>3?`<button class="more" id="more">${all?"Show top 3 events only":"Show all "+evs.length+" events"}</button>`:""}`;
  const b=document.getElementById("more");if(b)b.onclick=()=>{all=!all;build()};
}
function tabs(){
  const t=document.getElementById("tabs");
  t.innerHTML=KIDS.map(x=>`<button role="tab" aria-selected="${x.k===cur}" data-k="${x.k}" style="--ac:${x.c}">${x.n}</button>`).join("")+`<button role="tab" aria-selected="${cur==="B"}" data-k="B" style="--ac:var(--c1)">Best times</button>`;
  t.querySelectorAll("button").forEach(b=>b.onclick=()=>{cur=b.dataset.k;all=false;tabs();build()});
}
tabs();build();
</script>
